<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16263a"/><stop offset="1" stop-color="#0a0f17"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#3aa0e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.38"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <!-- contour lines of an unexplored land -->
    <g fill="none" stroke="#5cc8ff" stroke-opacity="0.13" stroke-width="3">
      <path d="M-20 150 C 90 90, 170 190, 270 130 S 450 70, 540 150"/>
      <path d="M-20 215 C 80 160, 180 250, 280 195 S 440 140, 540 215"/>
      <path d="M-20 400 C 100 350, 190 440, 300 385 S 450 340, 540 405"/>
      <path d="M-20 460 C 110 410, 200 500, 310 445 S 460 400, 540 465"/>
    </g>
    <!-- the way walked so far -->
    <path d="M70 430 C 130 380, 110 320, 170 300 S 215 345, 256 338" fill="none" stroke="#ffd040" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 22"/>
    <circle cx="70" cy="430" r="13" fill="#ffd040"/>
    <!-- the area to discover -->
    <circle cx="256" cy="338" r="150" fill="url(#glow)"/>
    <ellipse cx="256" cy="338" rx="118" ry="42" fill="#5cc8ff" fill-opacity="0.10" stroke="#8fdcff" stroke-opacity="0.9" stroke-width="5" stroke-dasharray="14 10"/>
    <!-- the pin -->
    <path d="M256 338 C 222 276, 168 236, 168 176 A 88 88 0 1 1 344 176 C 344 236, 290 276, 256 338 Z" fill="url(#pin)" stroke="#0a0f17" stroke-width="7" stroke-linejoin="round"/>
    <!-- a compass star in it -->
    <circle cx="256" cy="176" r="52" fill="#0d1622"/>
    <path d="M256 128 L268 164 L304 176 L268 188 L256 224 L244 188 L208 176 L244 164 Z" fill="#ffd040"/>
    <path d="M256 128 L256 176 L268 164 Z M304 176 L256 176 L268 188 Z M256 224 L256 176 L244 188 Z M208 176 L256 176 L244 164 Z" fill="#c8961e"/>
    <circle cx="256" cy="176" r="7" fill="#0d1622"/>
  </g>
  <rect x="19" y="19" width="474" height="474" rx="93" fill="none" stroke="#ffd040" stroke-opacity="0.55" stroke-width="6"/>
</svg>
